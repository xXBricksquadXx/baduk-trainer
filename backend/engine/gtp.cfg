# backend/engine/gtp.cfg — Intel OpenCL GPU Config for AI Sensei
logDir = gtp_logs
logAllGTPCommunication = false
logSearchInfo = false

# Fast response (<150ms) without starving Ollama on CPU/RAM
maxVisits = 100
maxPlayouts = 100
numSearchThreads = 2

# Resignation keys required by KataGo parser
allowResignation = false
resignThreshold = -0.90
resignConsecTurns = 3

openclUseFP16 = auto
rules = chinese